name: Intelligence Integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install validation dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate intelligence integrity
        run: node scripts/validate-intelligence.mjs
      - name: Validate JSON schemas
        run: node scripts/validate-schemas.mjs
      - name: Validate immutable usage events
        run: node scripts/validate-usage-events.mjs
      - name: Run validator negative self-tests
        run: node scripts/self-test-integrity.mjs
      - name: Check knowledge freshness
        run: node scripts/check-staleness.mjs
      - name: Benchmark deterministic retrieval expectations
        run: node scripts/benchmark-retrieval.mjs
      - name: Generate retrieval quality metrics
        run: node scripts/benchmark-retrieval-metrics.mjs
      - name: Run retrieval scale regression test
        run: node scripts/scale-test-retrieval.mjs
      - name: Regenerate derived indexes
        run: node scripts/generate-indexes.mjs
      - name: Regenerate health metrics
        env:
          INTELLIGENCE_NOW: '2026-08-20T00:30:00.000Z'
        run: node scripts/generate-health-metrics.mjs
      - name: Generate task-run learning metrics
        run: node scripts/generate-task-run-metrics.mjs
      - name: Verify generated artifacts are committed
        run: git diff --exit-code -- index/knowledge-index.json index/evidence-reverse-index.json metrics/intelligence-health.json metrics/task-run-metrics.json benchmarks/retrieval-metrics.json
