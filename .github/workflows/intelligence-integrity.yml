name: Intelligence Integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install validation dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate intelligence integrity
        run: node scripts/validate-intelligence.mjs
      - name: Validate JSON schemas
        run: node scripts/validate-schemas.mjs
      - name: Check knowledge freshness
        run: node scripts/check-staleness.mjs
      - name: Regenerate derived indexes
        run: node scripts/generate-indexes.mjs
      - name: Verify generated indexes are committed
        run: git diff --exit-code -- index/knowledge-index.json index/evidence-reverse-index.json
